{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiKHA - Settings</title>
    <link rel="stylesheet" href="{% static 'css/user_settings/settings.css' %}">
</head>
<body>
    <header class="topbar">
        <a href="{% url 'home:home' %}" class="brand">LiKHA</a>
        <nav>
            <a href="{% url 'home:home' %}">Home</a>
            <a href="{% url 'profile:profile' %}">Profile</a>
            <a href="{% url 'user_settings:settings' %}" class="active">Settings</a>
            <a href="{% url 'login:logout' %}">Logout</a>
        </nav>
    </header>

    <main class="page">
        <div class="card">
            <h1>Settings</h1>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="switch-row">
                    <div>
                        <p class="switch-title">Dark mode</p>
                        <p class="switch-subtitle">Use a darker color scheme.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" name="dark_mode" {% if settings.dark_mode %}checked{% endif %}>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="switch-row">
                    <div>
                        <p class="switch-title">Email notifications</p>
                        <p class="switch-subtitle">Get updates sent to your inbox.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" name="email_notifications" {% if settings.email_notifications %}checked{% endif %}>
                        <span class="slider"></span>
                    </label>
                </div>

                <button type="submit" class="btn-primary">Save changes</button>
            </form>
        </div>
    </main>
</body>
</html>
