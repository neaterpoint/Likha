{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LiKHA - Settings</title>
    <link rel="stylesheet" href="{% static 'css/user_settings/settings.css' %}">
</head>
<body>
    <h1>Settings</h1>

    {% if messages %}
        <div class="message-box">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>
                <input type="checkbox" name="dark_mode" {% if settings.dark_mode %}checked{% endif %}>
                Dark mode
            </label>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="email_notifications" {% if settings.email_notifications %}checked{% endif %}>
                Email notifications
            </label>
        </div>

        <button type="submit">Save</button>
    </form>

    <a href="{% url 'home:home' %}">Back to Home</a>
</body>
</html>
