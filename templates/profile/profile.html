{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiKHA - Profile</title>
    <link rel="stylesheet" href="{% static 'css/profile/profile.css' %}">
</head>
<body>
    <header class="topbar">
        <a href="{% url 'home:home' %}" class="brand">LiKHA</a>
        <nav>
            <a href="{% url 'home:home' %}">Home</a>
            <a href="{% url 'profile:profile' %}" class="active">Profile</a>
            <a href="{% url 'user_settings:settings' %}">Settings</a>
            <a href="{% url 'login:logout' %}">Logout</a>
        </nav>
    </header>

    <main class="page">
        <div class="card">
            <h1>Profile</h1>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="avatar-row">
                    <div class="avatar">
                        {% if profile.avatar_path %}
                            <img src="{{ profile.avatar_path.url }}" alt="Profile image">
                        {% else %}
                            <span>{{ user.username|slice:":1"|upper }}</span>
                        {% endif %}
                    </div>
                    <label class="file-label">
                        Change photo
                        <input type="file" name="avatar_path" hidden>
                    </label>
                </div>

                <div class="field">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" value="{{ profile.first_name }}" placeholder="First name">
                </div>

                <div class="field">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" value="{{ profile.last_name }}" placeholder="Last name">
                </div>

                <div class="field">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="A short bio">{{ profile.bio }}</textarea>
                </div>

                <button type="submit" class="btn-primary">Save changes</button>
            </form>
        </div>
    </main>
</body>
</html>
