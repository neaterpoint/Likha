{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LiKHA{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/home/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/home/scan.css' %}">
</head>
<body>
    <header class="topbar">
        <a href="{% url 'home:home' %}" class="brand">LiKHA</a>
        <nav>
            <a href="{% url 'home:home' %}">Home</a>
            <a href="{% url 'home:scan' %}" {% if active == 'scan' %}class="active"{% endif %}>Scan</a>
            <a href="{% url 'home:history' %}" {% if active == 'history' %}class="active"{% endif %}>History</a>
            <a href="{% url 'profile:profile' %}">Profile</a>
            <a href="{% url 'user_settings:settings' %}">Settings</a>
            <a href="{% url 'login:logout' %}">Logout</a>
        </nav>
    </header>

    <main class="page">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}<p>{{ message }}</p>{% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
